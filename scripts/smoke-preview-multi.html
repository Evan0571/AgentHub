         todo={todo}\n          onToggle={onToggle}\n          onRemove={onRemove}\n        />\n      ))}\n    </ul>\n  );\n}\n","TodoItem":"interface Todo {\n  id: number;\n  text: string;\n  done: boolean;\n}\n\ninterface Props {\n  todo: Todo;\n  onToggle: (id: number) => void;\n  onRemove: (id: number) => void;\n}\n\nexport default function TodoItem({ todo, onToggle, onRemove }: Props) {\n  return (\n    <li className=\"flex items-center gap-2 border rounded px-3 py-2\">\n      <input\n        type=\"checkbox\"\n        checked={todo.done}\n        onChange={() => onToggle(todo.id)}\n        className=\"w-4 h-4\"\n      />\n      <span\n        className={`flex-1 ${todo.done ? \"line-through text-gray-400\" : \"\"}`}\n      >\n        {todo.text}\n      </span>\n      <button\n        className=\"text-red-500 hover:text-red-700 text-sm\"\n        onClick={() => onRemove(todo.id)}\n      >\n        删除\n      </button>\n    </li>\n  );\n}\n"};
